version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: gluco_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      # Copia tu archivo .sql a la carpeta de inicialización de MySQL
      - ./dist/GlucoAPI.sql:/docker-entrypoint-initdb.d/esquema.sql
      - mysql_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gluco_api
      DB_USER: root
      DB_PASS: root

volumes:
  mysql_data: